name: build
on:
  schedule:
    - cron: '17 4 * * 1'   # weekly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      zfs: ${{ steps.p.outputs.zfs }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./plan.sh >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Build ${{ matrix.rel }}
        run: |
          docker run --rm -v "$PWD:/src" debian:trixie \
            /src/build.sh "${{ matrix.dver }}" "${{ needs.plan.outputs.zfs }}" /src/out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ matrix.rel }}" out/* \
            --title "Linux ${{ matrix.dver }} (Debian) + ${{ needs.plan.outputs.zfs }} (builtin)" \
            --notes "Debian's kernel ${{ matrix.dver }} (built from Debian source package linux ${{ matrix.dver }} with its own amd64 config) with OpenZFS ${{ needs.plan.outputs.zfs }} compiled in (CONFIG_ZFS=y), image + headers debs, and the matching ZFS userland tarball."
      # Keep one release per line. Runs only after Publish succeeded, and only
      # once the new release lists every built file, so a failed build never
      # leaves a line with no release.
      - name: Prune older ${{ matrix.dver }} line releases
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ matrix.rel }}
          DVER: ${{ matrix.dver }}
        run: |
          want=$(ls out | wc -l)
          have=$(gh release view "$REL" --json assets -q '.assets | map(select(.state == "uploaded")) | length')
          [ "$have" -eq "$want" ] || { echo "$REL has $have/$want assets, not pruning" >&2; exit 1; }
          case $DVER in 6.12[.-]*) line='^6\.12[.-]' ;; 7.*) line='^7\.' ;; *) echo "unknown line $DVER" >&2; exit 1 ;; esac
          gh release list --limit 200 --json tagName -q '.[].tagName' |
            grep -E "$line" | grep -- '-zfs-' | grep -vxF "$REL" |
            while read -r old; do
              echo "deleting $old"
              gh release delete "$old" --cleanup-tag -y
            done
